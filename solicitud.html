function setLang(l,push){lang=l;document.documentElement.lang=l;
  ["es","en"].forEach(x=>{const a=document.getElementById("l-"+x);a.style.color=x===l?"var(--fg)":"";a.setAttribute("aria-current",x===l?"true":"false")});
  document.getElementById("h-tag").textContent=t("hTag");
  document.getElementById("h-sub").textContent=t("hSub");
  document.getElementById("h-home").setAttribute("href",l==="es"?"es.html":"./");
  const q=l==="en"?"?lang=en":"";
  const fl=document.getElementById("f-legal"),fp=document.getElementById("f-priv");
  fl.setAttribute("href","legal.html"+q+"#aviso");fl.textContent=t("legal");
  fp.setAttribute("href","legal.html"+q+"#privacidad");fp.textContent=t("priv");
  document.title=(l==="es"?"Solicitar propuesta":"Request a proposal")+" · MOMENTO280";
  if(push){try{const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u)}catch(e){}}
  render(false)}
["es","en"].forEach(x=>document.getElementById("l-"+x).addEventListener("click",e=>{e.preventDefault();setLang(x,true)}));

function render(anim=true){
  let h="";

  app.innerHTML=`<div class="${anim?"fade":""}" style="display:flex;flex-direction:column;gap:28px">${h}</div>`;
  bind();
}

  <p class="note">${t("from")}</p>`}

function stepView(){

    body=`<div class="fields">${s.fields.map(f=>`<div class="field ${f.full?"full":""}">

      <input id="f-${f.id}" data-f="${f.id}" type="${f.type||"text"}" value="${esc(A[f.id])}" placeholder="${f.ph?esc(L(f.ph)):""}" ${f.type==="number"?'min="0" inputmode="numeric"':""}>
    </div>`).join("")}</div>`;
  } else {
    const multi=s.type==="multi", cur=A[s.id]||(multi?[]:null);
    body=`<div class="${multi?"chips":"opts"}" role="group">${s.opts.map(o=>{
      const on=multi?cur.includes(o.v):cur===o.v;
      return `<button type="button" class="opt ${multi?"multi":""}" data-o="${o.v}" aria-pressed="${on}">${multi?'<span class="mk"></span>':""}<span>${L(o)}</span>${multi?"":'<span class="mk"></span>'}</button>`}).join("")}</div>`;
  }
  if(s.extra){const e=s.extra;
    body+=`<div class="field"><label for="f-${e.id}">${L(e)}</label>${e.area
      ?`<textarea id="f-${e.id}" data-f="${e.id}">${esc(A[e.id])}</textarea>`

  if(i===n-1)body+=`<label class="consent"><input type="checkbox" id="consent" ${A.consent?"checked":""}><span>${t("consent")}</span></label>`;

  <div class="progress"><span>${t("step")} ${i+1} ${t("of")} ${n}</span><span class="bar"><i style="width:${(i+1)/n*100}%"></i></span></div>
  <h2>${L(s)}</h2>
  ${body}

  <div class="form-nav">
    <button type="button" class="btn ghost" id="back">← ${t("back")}</button>
    <button type="button" class="btn" id="next">${i===n-1?t("send"):t("next")}</button>
  </div>`}

function evaluate(){
  let pts=0,out=false;
  FLOWS[flow].forEach(s=>{if(s.type==="choice"){const o=s.opts.find(o=>o.v===A[s.id]);if(o){pts+=o.p;if(o.out)out=true}}});
  if(flow==="couple"&&A.country&&!/espa|spain/i.test(A.country))pts+=1;
  if((A.pieces||[]).length>=4)pts+=1;
  const tier=out?"X":pts>=CONFIG.tierA?"A":"B";
  return {pts,tier};
}

function result(){
  const {pts,tier}=evaluate(), name=(A.name||"").split(/\s|&|y\b/)[0];
  const contact=`<div class="contact-box">
    <span>${t("wa")}: <b>${CONFIG.whatsapp}</b></span>
    <span>${t("tel")}: <b>${CONFIG.phone}</b></span>
    <span>${t("mail")}: <b>${CONFIG.email}</b></span></div>`;
  const main = tier==="X"
    ? `<div class="eyebrow">Momento280</div><h2>${t("outTitle")}</h2><p class="lede">${flow==="company"?t("outTextEv"):t("outText")}</p>`
    : `<div class="eyebrow">${t("thanks")}${name?", "+esc(name):""}</div><h2>${t("okTitle")}</h2><p class="lede">${t("okText")}</p>${contact}`;
  return `${main}
    <div class="form-nav" style="justify-content:flex-start"><button type="button" class="btn ghost" id="restart">${t("restart")}</button></div>`}

function buildPayload(pts,tier){
  const ES=x=>x.es;
  const prof={couple:"Pareja",planner:"Wedding planner",company:"Empresa / agencia"}[flow];
  const tierTxt={A:"Prioridad A",B:"Prioridad B",X:"Fuera de perfil"}[tier];
  const p={access_key:CONFIG.web3formsKey,
    subject:`[${tierTxt}] Nueva solicitud · ${prof} · ${A.name||""}`,
    from_name:"Web Momento280", replyto:A.email||"", botcheck:"",
    "Prioridad":`${tierTxt} (${pts} puntos)`, "Perfil":prof, "Idioma":lang.toUpperCase(), "Consentimiento privacidad":"Sí"};
  FLOWS[flow].forEach(s=>{
    if(s.type==="fields") s.fields.forEach(f=>{if(A[f.id])p[ES(f)]=A[f.id]});
    else if(s.type==="choice"){const o=s.opts.find(o=>o.v===A[s.id]);if(o)p[ES(s)]=ES(o)}
    else if(s.type==="multi"){const v=(A[s.id]||[]).map(x=>ES(s.opts.find(o=>o.v===x))).join(", ");if(v)p[ES(s)]=v}
    if(s.extra&&A[s.extra.id])p[ES(s.extra)]=A[s.extra.id];
  });
  return p;
}

async function submit(){
  const {pts,tier}=evaluate();
  if(tier==="X"&&!CONFIG.sendOutOfProfile)return true;
  if(document.getElementById("hp")?.value)return true; // bot
  const r=await fetch("https://api.web3forms.com/submit",{method:"POST",
    headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify(buildPayload(pts,tier))});
  const j=await r.json().catch(()=>({}));
  return r.ok&&j.success!==false;
}

function validate(){
  const s=FLOWS[flow][i];
  if(s.type==="fields"){
    const miss=s.fields.filter(f=>f.req&&!String(A[f.id]||"").trim());
    const badMail=s.fields.some(f=>f.type==="email"&&A[f.id]&&!/^\S+@\S+\.\S+$/.test(A[f.id]));
    return miss.length||badMail?t("required"):"";
  }
  if(s.type==="choice"&&!A[s.id])return t("pick");
  if(s.type==="multi"&&!(A[s.id]||[]).length)return t("pick");
  if(i===FLOWS[flow].length-1&&!A.consent)return t("consentErr");
  return "";
}

function bind(){
  app.querySelectorAll("[data-flow]").forEach(b=>b.onclick=()=>{flow=b.dataset.flow;i=0;A={};err="";track("Perfil elegido",{perfil:PERFIL[flow],origen:"formulario",idioma:lang});render()});
  app.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{A[el.dataset.f]=el.value});
  const cs=document.getElementById("consent"); if(cs)cs.onchange=()=>{A.consent=cs.checked};
  const s=flow&&FLOWS[flow][i];
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.o;
    if(s.type==="multi"){const a=A[s.id]||[];A[s.id]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}
    else A[s.id]=v;
    err="";
    app.querySelectorAll("[data-o]").forEach(x=>{const on=s.type==="multi"?A[s.id].includes(x.dataset.o):A[s.id]===x.dataset.o;x.setAttribute("aria-pressed",on)});
    document.getElementById("err").textContent="";
  });
  const nx=document.getElementById("next"), bk=document.getElementById("back");
  if(nx)nx.onclick=async()=>{err=validate();if(err){document.getElementById("err").textContent=err;return}
    const o=s.type==="choice"&&s.opts.find(o=>o.v===A[s.id]);
    const last=(o&&o.out)||i===FLOWS[flow].length-1;
    if(last){
      nx.disabled=true;nx.textContent=t("sending");
      let ok=false;try{ok=await submit()}catch(e){ok=false}
      if(!ok){nx.disabled=false;nx.textContent=t("send");document.getElementById("err").textContent=t("sendErr");return}
      const ev=evaluate();
      if(ev.tier==="X")track("Fuera de perfil",{perfil:PERFIL[flow],pregunta:PASO[s.id]||s.id});
      else track("Solicitud enviada",{perfil:PERFIL[flow],prioridad:ev.tier,idioma:lang});
      i=FLOWS[flow].length;
    } else {track("Paso formulario",{perfil:PERFIL[flow],paso:String(i+1)+" · "+(PASO[s.id]||s.id)});i++;}
    err="";render();window.scrollTo({top:0})};
  if(bk)bk.onclick=()=>{err="";if(i===0)flow=null;else i--;render()};
  const r=document.getElementById("restart"); if(r)r.onclick=()=>{flow=null;i=0;A={};render()};
}
{const pf=new URLSearchParams(location.search).get("perfil");const map={planner:"planner",pareja:"couple",empresa:"company"};if(map[pf]){flow=map[pf];track("Perfil elegido",{perfil:PERFIL[flow],origen:"enlace",idioma:lang})}}
setLang(lang);
</script>
</body>
